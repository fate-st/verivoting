[package]
name = "g17-host"
version = "0.1.0"
edition = "2021"

[features]
zkvm = ["dep:g17-methods", "dep:risc0-zkvm"]

[dependencies]
g17-common = { path = "../common" }
ark-bls12-381 = { version = "=0.4.0", default-features = false, features = ["curve", "std"] }
ark-ff = { version = "=0.4.2", default-features = false, features = ["std"] }
ark-groth16 = { version = "=0.4.0", default-features = false, features = ["std"] }
hex = "=0.4.3"
serde_json = "=1.0.154"
g17-methods = { path = "../methods", optional = true }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["client"], optional = true }
