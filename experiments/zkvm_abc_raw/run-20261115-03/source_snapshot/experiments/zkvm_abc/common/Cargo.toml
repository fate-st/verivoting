[package]
name = "g17-common"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-bls12-381 = { version = "=0.4.0", default-features = false, features = ["curve", "std"] }
ark-groth16 = { version = "=0.4.0", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.4.2", default-features = false, features = ["std"] }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
