[package]
name = "g18-prover-admission"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"

[dependencies]
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["client", "disable-dev-mode"] }
risc0-binfmt = "=3.0.6"
risc0-zkos-v1compat = "=2.2.3"
serde_json = "=1.0.154"
bincode = "=1.3.3"
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "none"
