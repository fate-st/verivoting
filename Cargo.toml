[workspace]
resolver = "2"
members = [
  "crates/vv-types",
  "crates/vv-crypto",
  "crates/vv-dkg",
  "crates/vv-registry",
  "crates/vv-disclosure",
  "crates/vv-bench",
  "crates/vv-friendly-crypto",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ark-bls12-381 = "0.4.0"
ark-ec = "0.4.2"
ark-ed-on-bls12-381 = { version = "0.4.0", features = ["r1cs"] }
ark-ff = "0.4.2"
ark-groth16 = "0.4.0"
ark-r1cs-std = "0.4.0"
ark-relations = "0.4.0"
ark-serialize = "0.4.2"
ark-std = "0.4.0"
curve25519-dalek = { version = "4.1.3", features = ["digest", "rand_core"] }
libc = "0.2.191"
rand_chacha = "0.3.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"

# Level 1 keeps the benchmark path optimized while avoiding prohibitively slow
# first-build code generation for the macro-heavy arkworks dependency graph.
[profile.release]
opt-level = 1


